# Common settings. Per-environment, non-secret settings live in local/ and prod/ (chosen by APP_ENV, default "local").
# Secrets (DATABASE_URL) never go in resources/ — they come from .env.<APP_ENV> or real environment variables.
spring:
  application:
    name: cards-backend
  config:
    # Later imports override earlier ones. Real environment variables override all of them.
    import:
      - optional:classpath:/${APP_ENV:local}/application.yml
      - optional:file:.env.${APP_ENV:local}[.properties]
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

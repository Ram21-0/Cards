# Production (APP_ENV=prod)
logging:
  level:
    com.cards: INFO

app:
  frontend-base-url: ${FRONTEND_ORIGIN}   # used to build shareable join links
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}      # set on the host, e.g. https://cards.example.com

server:
  error:
    include-message: never
    include-stacktrace: never

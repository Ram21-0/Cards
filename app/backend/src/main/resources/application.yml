# Common settings. Per-environment, non-secret settings live in local/ and prod/ (chosen by APP_ENV, default "local").
# Secrets (DATABASE_URL) never go in resources/ — they come from .env.<APP_ENV> or real environment variables.
spring:
  application:
    name: cards-backend
  config:
    # Per-environment, non-secret settings (APP_ENV, default "local"). Secrets come from .env.<APP_ENV> or real
    # environment variables — see config/DotEnvPostProcessor.
    import: optional:classpath:/${APP_ENV:local}/application.yml
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}
